[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsde"
version = "0.1.0"
description = "Recursive Spec-Driven Engineering: a declarative Markdown spec language and CLI that drives coding agents with evidence-based verification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sourena", email = "sourena.khanzadeh@gmail.com" }]
keywords = ["specification", "spec-driven", "coding-agent", "declarative", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rsde = "rsde.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
