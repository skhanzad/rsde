[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rsde"
dynamic = ["version"]
description = "Recursive Spec-Driven Engineering: a declarative Markdown spec language and CLI that drives coding agents with evidence-based verification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sourena", email = "sourena.khanzadeh@gmail.com" }]
keywords = ["specification", "spec-driven", "coding-agent", "declarative", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/skhanzad/rsde"
Documentation = "https://github.com/skhanzad/rsde#readme"
Repository = "https://github.com/skhanzad/rsde.git"
Issues = "https://github.com/skhanzad/rsde/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.10", "build>=1.2", "twine>=6"]

[project.scripts]
rsde = "rsde.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rsde*"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "rsde.__version__" }

[tool.setuptools.package-data]
rsde = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
